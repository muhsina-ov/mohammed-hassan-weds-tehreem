<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Amiri:wght@700&family=Jost:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at 50% 45%, #0e2e21 0%, #061610 60%, #030a07 100%);
    font-family: 'Jost', sans-serif;
    color: #f6e8cc;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient Gold Flares & Lighting */
  .glow-top {
    position: absolute;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 350px;
    background: radial-gradient(ellipse at center, rgba(240, 206, 120, 0.28) 0%, rgba(212, 175, 55, 0.08) 50%, transparent 70%);
    pointer-events: none;
  }

  .glow-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 850px;
    height: 500px;
    background: radial-gradient(ellipse at center, rgba(227, 189, 104, 0.16) 0%, transparent 68%);
    pointer-events: none;
  }

  /* Stardust sparkles */
  .sparkles {
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(1.5px 1.5px at 15% 20%, rgba(255, 240, 190, 0.8), transparent),
      radial-gradient(2px 2px at 85% 25%, rgba(255, 230, 150, 0.75), transparent),
      radial-gradient(1.5px 1.5px at 30% 75%, rgba(255, 240, 190, 0.6), transparent),
      radial-gradient(2px 2px at 75% 80%, rgba(255, 220, 130, 0.8), transparent),
      radial-gradient(1px 1px at 50% 15%, rgba(255, 245, 200, 0.9), transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, rgba(255, 235, 170, 0.7), transparent),
      radial-gradient(1.5px 1.5px at 10% 65%, rgba(255, 240, 180, 0.65), transparent);
    pointer-events: none;
  }

  /* Double Golden Filigree Frame */
  .frame-border {
    position: absolute;
    inset: 20px;
    border: 1px solid rgba(212, 175, 55, 0.45);
    border-radius: 16px;
    pointer-events: none;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.4);
  }

  .frame-inner-border {
    position: absolute;
    inset: 27px;
    border: 1px solid rgba(212, 175, 55, 0.22);
    border-radius: 12px;
    pointer-events: none;
  }

  /* Top Stage Arch Garland */
  .stage-garland {
    position: absolute;
    top: -70px;
    left: 50%;
    transform: translateX(-50%);
    width: 620px;
    height: auto;
    filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 16px rgba(212, 175, 55, 0.35));
    pointer-events: none;
    z-index: 2;
    opacity: 0.85;
  }

  /* Moroccan Lanterns */
  .lanterns-row {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 120px;
    margin-top: 10px;
    margin-bottom: 8px;
    position: relative;
    z-index: 3;
  }

  .lantern-svg {
    width: 22px;
    height: 38px;
    color: #e5ca75;
    filter: drop-shadow(0 0 8px rgba(235, 200, 110, 0.8));
  }

  .lantern-svg--center {
    width: 26px;
    height: 44px;
    color: #fff2c4;
    filter: drop-shadow(0 0 12px rgba(250, 220, 130, 0.95));
  }

  /* Card Content Container */
  .card-container {
    position: relative;
    z-index: 4;
    width: 100%;
    max-width: 1060px;
    text-align: center;
    padding: 0 20px;
    margin-top: 35px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Bismillah */
  .bismillah-ar {
    font-family: 'Amiri', serif;
    font-size: 34px;
    color: #fff4d0;
    text-shadow: 0 0 14px rgba(227, 189, 104, 0.65);
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.46em;
    text-transform: uppercase;
    color: #dfbe6d;
    margin: 4px 0 12px;
  }

  /* Couple Names */
  .couple-names {
    font-family: 'Great Vibes', cursive;
    font-size: 72px;
    line-height: 1.15;
    margin: 0;
    white-space: nowrap;
    background: linear-gradient(135deg, #fffbee 0%, #f6dd88 28%, #dfb54b 60%, #fff0b8 82%, #b38520 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 20px rgba(227, 189, 104, 0.45));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .couple-amp {
    font-size: 56px;
    color: #f7dc88;
    -webkit-text-fill-color: #f7dc88;
    filter: drop-shadow(0 0 10px rgba(227, 189, 104, 0.7));
  }

  .couple-arabic {
    font-family: 'Amiri', serif;
    font-size: 26px;
    color: #e5c977;
    margin-top: 4px;
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    letter-spacing: 0.05em;
  }

  /* Botanical Divider */
  .botanical-divider {
    width: 320px;
    height: auto;
    margin: 10px auto 16px;
    display: block;
    filter: drop-shadow(0 2px 10px rgba(212, 175, 55, 0.45));
  }

  /* Event Details Badge Bar */
  .event-details-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 10px 32px;
    background: rgba(10, 32, 23, 0.82);
    border: 1px solid rgba(212, 175, 55, 0.55);
    border-radius: 30px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), inset 0 0 14px rgba(212, 175, 55, 0.12);
  }

  .event-col {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .event-icon {
    color: #f7dc88;
    font-size: 16px;
  }

  .event-text-primary {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #fffef8;
    font-weight: 600;
  }

  .event-text-secondary {
    font-family: 'Jost', sans-serif;
    font-size: 13.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #dfbe6d;
    font-weight: 500;
  }

  .event-bar-separator {
    color: rgba(212, 175, 55, 0.5);
    font-size: 18px;
  }

  /* Monogram Seal Medallion in Corner */
  .floating-seal {
    position: absolute;
    bottom: 34px;
    right: 48px;
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fffbed 0%, #f7dc88 22%, #d4a737 48%, #9e6e12 78%, #603f05 100%);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 18px rgba(212, 175, 55, 0.5), inset 0 2px 4px rgba(255,255,255,0.7), inset 0 -3px 8px rgba(50, 28, 2, 0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
    border: 1px solid rgba(255, 245, 205, 0.6);
  }

  .floating-seal-mono {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #fffdf6;
    text-shadow: 0 1px 1px rgba(255, 255, 255, 0.8), 0 -1px 2px rgba(60, 35, 3, 0.95);
    line-height: 1;
  }

  .floating-seal-tag {
    font-family: 'Jost', sans-serif;
    font-size: 6.5px;
    font-weight: 600;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: #fff9e0;
    margin-top: 3px;
    text-shadow: 0 1px 2px rgba(45, 25, 2, 0.95);
  }

  /* Corner Floral Brackets */
  .corner-botanical {
    position: absolute;
    width: 95px;
    height: 95px;
    pointer-events: none;
    z-index: 3;
    opacity: 0.82;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }

  .corner-tl { top: 22px; left: 22px; }
  .corner-tr { top: 22px; right: 22px; transform: scaleX(-1); }
  .corner-bl { bottom: 22px; left: 22px; transform: scaleY(-1); }
  .corner-br { bottom: 22px; right: 22px; transform: scale(-1, -1); }
</style>
</head>
<body>

  <!-- Ambient Glows -->
  <div class="glow-top"></div>
  <div class="glow-center"></div>
  <div class="sparkles"></div>

  <!-- Decorative Borders -->
  <div class="frame-border"></div>
  <div class="frame-inner-border"></div>

  <!-- Corner Bouquets -->
  <img src="assets/images/floral/floral_corner.png" class="corner-botanical corner-tl" alt="">
  <img src="assets/images/floral/floral_corner.png" class="corner-botanical corner-tr" alt="">
  <img src="assets/images/floral/floral_corner.png" class="corner-botanical corner-bl" alt="">

  <!-- Royal Floral Garland at Top Center -->
  <img src="assets/images/floral/floral_arch_garland.png" class="stage-garland" alt="">

  <!-- Center Card -->
  <div class="card-container">
    
    <!-- Swaying Lanterns -->
    <div class="lanterns-row">
      <svg class="lantern-svg" viewBox="0 0 24 40" fill="currentColor">
        <path d="M12 2 L12 8 M12 6 C6 6 4 10 4 15 L2 18 L22 18 L20 15 C20 10 18 6 12 6 Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M3 18 L6 30 L18 30 L21 18 Z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="12" cy="24" r="3" fill="currentColor"/>
      </svg>
      <svg class="lantern-svg lantern-svg--center" viewBox="0 0 24 40" fill="currentColor">
        <path d="M12 2 L12 8 M12 6 C6 6 4 10 4 15 L2 18 L22 18 L20 15 C20 10 18 6 12 6 Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M3 18 L6 30 L18 30 L21 18 Z" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="12" cy="24" r="3.5" fill="currentColor"/>
      </svg>
      <svg class="lantern-svg" viewBox="0 0 24 40" fill="currentColor">
        <path d="M12 2 L12 8 M12 6 C6 6 4 10 4 15 L2 18 L22 18 L20 15 C20 10 18 6 12 6 Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M3 18 L6 30 L18 30 L21 18 Z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="12" cy="24" r="3" fill="currentColor"/>
      </svg>
    </div>

    <!-- Bismillah in Arabic Calligraphy -->
    <div class="bismillah-ar">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
    <div class="eyebrow">The Wedding Celebration of</div>

    <!-- Couple Names in Majestic Script -->
    <h1 class="couple-names">
      <span>Mohammed Hassan</span>
      <span class="couple-amp">&amp;</span>
      <span>Tehreem</span>
    </h1>

    <div class="couple-arabic">محمد حسّان &amp; تحريم</div>

    <!-- Symmetrical Botanical Divider -->
    <img src="assets/images/floral/floral_divider_bar.png" class="botanical-divider" alt="">

    <!-- Event Details Ribbon -->
    <div class="event-details-bar">
      <div class="event-col">
        <span class="event-icon">✦</span>
        <span class="event-text-primary">Tuesday, 10 November 2026 · 7:00 PM</span>
      </div>
      <span class="event-bar-separator">·</span>
      <div class="event-col">
        <span class="event-text-secondary">Vincent Wedding Lawn · Kausa, Mumbra</span>
        <span class="event-icon">✦</span>
      </div>
    </div>

  </div>

  <!-- 3D Gold Embossed Wax Seal in Bottom Right Corner -->
  <div class="floating-seal">
    <div class="floating-seal-mono">M &amp; T</div>
    <div class="floating-seal-tag">Royal Seal</div>
  </div>

</body>
</html>
